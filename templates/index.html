
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Automático</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <span class="etiqueta">ATENDIMENTO DIGITAL</span>
            <h1>Olá! Seja bem-vindo(a).</h1>
            <p>Vamos identificar seu dispositivo para apresentar as orientações iniciais.</p>
        </header>

        <form method="POST">
            <label for="dispositivo">Qual é o seu dispositivo?</label>

            <select id="dispositivo" name="dispositivo">
                <option value="">Selecione uma opção</option>
                <option value="Celular" {% if dispositivo == "Celular" %}selected{% endif %}>Celular</option>
                <option value="Smart TV" {% if dispositivo == "Smart TV" %}selected{% endif %}>Smart TV</option>
                <option value="TV Box" {% if dispositivo == "TV Box" %}selected{% endif %}>TV Box</option>
            </select>

            <div id="campo-sistema" hidden>
                <label id="label-sistema" for="sistema">Qual é o sistema do aparelho?</label>
                <select id="sistema" name="sistema">
                    <option value="">Selecione uma opção</option>
                </select>
            </div>

            <div id="campo-marca" hidden>
                <label for="marca">Qual é a marca da sua Smart TV?</label>
                <select id="marca" name="marca">
                    <option value="">Selecione a marca</option>
                    <option value="Samsung" {% if marca == "Samsung" %}selected{% endif %}>Samsung</option>
                    <option value="LG" {% if marca == "LG" %}selected{% endif %}>LG</option>
                    <option value="TCL" {% if marca == "TCL" %}selected{% endif %}>TCL</option>
                    <option value="Philco" {% if marca == "Philco" %}selected{% endif %}>Philco</option>
                    <option value="Philips" {% if marca == "Philips" %}selected{% endif %}>Philips</option>
                    <option value="Sony" {% if marca == "Sony" %}selected{% endif %}>Sony</option>
                    <option value="AOC" {% if marca == "AOC" %}selected{% endif %}>AOC</option>
                    <option value="Hisense" {% if marca == "Hisense" %}selected{% endif %}>Hisense</option>
                    <option value="Panasonic" {% if marca == "Panasonic" %}selected{% endif %}>Panasonic</option>
                    <option value="Outra" {% if marca == "Outra" %}selected{% endif %}>Outra marca</option>
                </select>
            </div>

            <button type="submit">Continuar</button>
        </form>

        {% if erro %}
<section class="resultado" role="alert">
    <h2>Confira sua seleção</h2>
    <p>{{ erro }}</p>
</section>
{% elif orientacao %}
<section class="resultado" aria-live="polite">
    <h2>Orientação para seu dispositivo</h2>
    <p>{{ orientacao }}</p>
</section>
{% endif %}

        <footer>
            <p>Atendimento inicial • Demonstração do MVP</p>
        </footer>
    </main>

    <input type="hidden" id="sistema-anterior" value="{{ sistema }}">
    <script>
        const dispositivo = document.getElementById("dispositivo");
        const campoSistema = document.getElementById("campo-sistema");
        const labelSistema = document.getElementById("label-sistema");
        const sistema = document.getElementById("sistema");
        const campoMarca = document.getElementById("campo-marca");
        const marca = document.getElementById("marca");

        const opcoesSistema = {
            "Celular": [
                { valor: "Android", texto: "Android" },
                { valor: "iOS", texto: "iPhone (iOS)" }
            ],
            "TV Box": [
                { valor: "Android TV/Google TV", texto: "Android TV / Google TV" },
                { valor: "Fire TV", texto: "Fire TV" },
                { valor: "Roku", texto: "Roku" },
                { valor: "Outro", texto: "Outro sistema" }
            ]
        };
function atualizarCampos() {
    const tipo = dispositivo.value;
    const mostrarMarca = tipo === "Smart TV";
    const mostrarSistema = tipo === "Celular" || tipo === "TV Box";

    console.log("Dispositivo selecionado:", tipo);
console.log("Mostrar marca:", mostrarMarca);
console.log("Mostrar sistema:", mostrarSistema);
    campoMarca.hidden = !mostrarMarca;
    marca.required = false;

    campoSistema.hidden = !mostrarSistema;
    sistema.required = false;

    labelSistema.textContent = tipo === "TV Box"
        ? "Qual é o sistema da sua TV Box?"
        : "Qual é o sistema do seu celular?";

    sistema.replaceChildren(new Option("Selecione uma opção", ""));

    (opcoesSistema[tipo] || []).forEach(function(opcao) {
        sistema.add(new Option(opcao.texto, opcao.valor));
    });

    const sistemaAnterior = document.getElementById("sistema-anterior").value;

    if (mostrarSistema && opcoesSistema[tipo].some(
        opcao => opcao.valor === sistemaAnterior
    )) {
        sistema.value = sistemaAnterior;
    }
}

dispositivo.addEventListener("change", function () {
    atualizarCampos();
});

window.addEventListener("pageshow", atualizarCampos);

atualizarCampos();

    </script>
</body>
</html>
